<body>
<h1>Open redirect demo</h1>
<p>This page would bounce to <code id=n></code> without an allowlist.</p>
<p style="color:#00ff9d">Educational flag: LLZ{allowlist_redirects}</p>
<p><a id=go href="#">Simulate continue</a> (stays here in demo)</p>
<script>
const next=new URLSearchParams(location.search).get('next')||'/';
document.getElementById('n').textContent=next;
document.getElementById('go').onclick=(e)=>{e.preventDefault();alert('Demo blocked external nav. In the wild, allowlist paths only.\nflag: LLZ{allowlist_redirects}');};
</script>
<script src="/assets/llc.js" defer></script>
