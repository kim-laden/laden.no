map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / {
        return 302 /docker/llz/;
    }

    location = /llz-docker {
        return 301 /docker/llz/;
    }

    location ^~ /llz-docker/ {
        rewrite ^/llz-docker/(.*)$ /docker/llz/$1 permanent;
    }

    location = /docker/llz {
        return 301 /docker/llz/;
    }

    # Docker-only player. Same lab start rules as /llz/, without touching
    # the shared file used by the other sites.
    location = /docker/llz/js/soundcloud-player.js {
        alias /opt/docker-player/soundcloud-player.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location ^~ /docker/llz/labs/api/ {
        proxy_pass http://api:18790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /docker/llz/v1.2/api/ {
        proxy_pass http://api:18790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /docker/llz/css/ {
        proxy_pass https://laden.no/css/;
        proxy_ssl_server_name on;
        proxy_set_header Host laden.no;
    }

    location ^~ /docker/llz/js/ {
        proxy_pass https://laden.no/js/;
        proxy_ssl_server_name on;
        proxy_set_header Host laden.no;
    }

    # Rewrite only real site roots. A bare "/ replacement breaks regexes
    # such as /"/g and the console's /z paths. The test banner uses single
    # quotes so it cannot close a double-quoted script string.
    location ^~ /docker/llz/ {
        alias /usr/share/nginx/html/llz/;
        index index.html;
        gzip off;
        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json text/javascript;
        sub_filter "<body>" "<body><div style='position:sticky;top:0;z-index:99999;background:#111;color:#f3efe4;font:13px/1.3 system-ui,sans-serif;padding:8px 12px;text-align:center'>Docker test, not the live lab. <a style='color:#f3efe4' href='https://laden.no/llz/'>Open the live lab</a></div>";
        sub_filter 'href="/"' 'href="/docker/llz/"';
        sub_filter "href='/'" "href='/docker/llz/'";
        sub_filter '/js/soundcloud-player.js' '/docker/llz/js/soundcloud-player.js';
        sub_filter '"/assets/' '"/docker/llz/assets/';
        sub_filter "'/assets/" "'/docker/llz/assets/";
        sub_filter '"/labs/' '"/docker/llz/labs/';
        sub_filter "'/labs/" "'/docker/llz/labs/";
        sub_filter '"/oracle/' '"/docker/llz/oracle/';
        sub_filter "'/oracle/" "'/docker/llz/oracle/";
        sub_filter '"/tips/' '"/docker/llz/tips/';
        sub_filter "'/tips/" "'/docker/llz/tips/";
        sub_filter '"/gear/' '"/docker/llz/gear/';
        sub_filter "'/gear/" "'/docker/llz/gear/";
        sub_filter '"/terminal/' '"/docker/llz/terminal/';
        sub_filter "'/terminal/" "'/docker/llz/terminal/";
        sub_filter '"/games/' '"/docker/llz/games/';
        sub_filter "'/games/" "'/docker/llz/games/";
        sub_filter '"/zocial/' '"/docker/llz/zocial/';
        sub_filter "'/zocial/" "'/docker/llz/zocial/";
        sub_filter '"/lld/' '"/docker/llz/lld/';
        sub_filter "'/lld/" "'/docker/llz/lld/";
        sub_filter '"/lla/' '"/docker/llz/lla/';
        sub_filter "'/lla/" "'/docker/llz/lla/";
        sub_filter 'href="/challenges/' 'href="/docker/llz/challenges/';
        sub_filter "href='/challenges/" "href='/docker/llz/challenges/";
        sub_filter "href: '/challenges/" "href: '/docker/llz/challenges/";
        sub_filter "back.href = '/challenges/" "back.href = '/docker/llz/challenges/";
        sub_filter 'href="/community/' 'href="/docker/llz/community/';
        sub_filter "href='/community/" "href='/docker/llz/community/";
        sub_filter "href: '/community/" "href: '/docker/llz/community/";
        sub_filter "return '/community/" "return '/docker/llz/community/";
        sub_filter "location.replace('/community/" "location.replace('/docker/llz/community/";
        sub_filter "view.href = '/community/" "view.href = '/docker/llz/community/";
        sub_filter 'href="/messages/' 'href="/docker/llz/messages/';
        sub_filter "href='/messages/" "href='/docker/llz/messages/";
        sub_filter "href: '/messages/" "href: '/docker/llz/messages/";
        sub_filter 'href="/account/' 'href="/docker/llz/account/';
        sub_filter "href='/account/" "href='/docker/llz/account/";
        sub_filter "href: '/account/" "href: '/docker/llz/account/";
        sub_filter "location.href = '/account/" "location.href = '/docker/llz/account/";
        sub_filter 'href="/forum/' 'href="/docker/llz/forum/';
        sub_filter "href='/forum/" "href='/docker/llz/forum/";
        sub_filter "href: '/forum/" "href: '/docker/llz/forum/";
        sub_filter 'href="/store/' 'href="/docker/llz/store/';
        sub_filter "href='/store/" "href='/docker/llz/store/";
        sub_filter 'location.replace("/gear/' 'location.replace("/docker/llz/gear/';
    }

    location ^~ /labs/api/ {
        proxy_pass http://api:18790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /v1.2/api/ {
        proxy_pass http://api:18790/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~ ^/(assets|account|challenges|community|forum|games|gear|labs|levi|lla|lld|messages|oracle|terminal|tips|v1\.1|zocial)(/.*)?$ {
        rewrite ^/([^/]+)(/.*)?$ /llz/$1$2 last;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
