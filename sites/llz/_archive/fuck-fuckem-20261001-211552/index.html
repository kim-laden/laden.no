<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUCK FUCK'EM — Laden Arcade</title>
  <meta name="description" content="FUCK FUCK'EM — Sewer of Rage. Doom-like raycaster arcade on Laden Labs Developer.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="ffe-bar">
    <div class="brand">
      <img src="icon.png" alt="" width="28" height="28">
      <div>
        <h1>FUCK FUCK'EM</h1>
        <span>Level 1 · Sewer of Rage</span>
      </div>
    </div>
    <div class="actions">
      <a href="/lld/">← LLD</a>
      <a href="/account/">Account</a>
    </div>
  </header>

  <div class="ffe-stage" id="ffe-stage">
    <canvas id="game" width="960" height="600" tabindex="0" aria-label="FUCK FUCK'EM game canvas"></canvas>
    <div class="ffe-overlay" id="ffe-resume" aria-hidden="true">
      <div class="card">
        <h2>Pointer unlocked</h2>
        <p>Click the canvas or press Resume to lock mouse look again.</p>
        <button type="button" id="ffe-resume-btn">Resume</button>
      </div>
    </div>
    <div class="ffe-gate" id="ffe-gate" aria-hidden="true">
      <div class="card">
        <div style="font:700 .68rem/1 JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8b9bb4">Members only</div>
        <h2>Sign in to play</h2>
        <p>This arcade drop is for Laden account holders. Log in, then come back.</p>
        <a href="/account/">Go to Account</a>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
